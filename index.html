  ctx.font = '17px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText(O ? O.line : G.lastPass, W/2, H/2 + 4);
  ctx.font = '13px monospace'; ctx.fillStyle = '#6a677f';
  ctx.fillText('This is fine. Nine of them are supposed to die.', W/2, H/2 + 36);
  ctx.fillText(G.companies + ' companies remaining', W/2, H/2 + 58);
}

function drawExitCard() {
  const got = G.exits[G.exits.length-1];
  const mark = G.lastMark || got, hype = G.lastHype || 0;
  const lost = mark - got;
  ctx.fillStyle = 'rgba(13,15,26,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  // the mark first, big and green — then what actually cleared
  ctx.fillStyle = '#6a677f'; ctx.font = '16px monospace';
  ctx.fillText('MARKED AT ' + fmtM(mark), W/2, H/2 - 66);
  ctx.fillStyle = '#59d68f'; ctx.font = 'bold 32px monospace';
  ctx.fillText('REALIZED ' + fmtM(got), W/2, H/2 - 26);
  if (G.signed && G.lastDilute < 0.999) {
    ctx.fillStyle = '#ffd75e'; ctx.font = 'bold 13px monospace';
    ctx.fillText('your bids cost you ' + ((1-G.lastDilute)*100).toFixed(0) +
                 '% of this exit', W/2, H/2 - 92);
  }
  if (lost > 0.5) {
    ctx.fillStyle = '#ff6b81'; ctx.font = 'bold 14px monospace';
    ctx.fillText('— ' + fmtM(lost) + ' of paper did not convert' +
                 (hype > 0 ? ' (you bought ' + fmtM(hype) + ' of it)' : ''), W/2, H/2 + 6);
  } else {
    ctx.font = '15px monospace'; ctx.fillStyle = '#e8e6f0';
    ctx.fillText('Actual cash. DPI moves. LPs feel something.', W/2, H/2 + 6);
  }
  ctx.font = '13px monospace'; ctx.fillStyle = '#6a677f';
  ctx.fillText((bestExit() === got ? 'New best exit. ' : '') +
    'Only your best one counts.', W/2, H/2 + 38);
}

// ---------------------------------------------------------------- screens
function renderTitle() {
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0,0,W,H);
  const t = performance.now()/1000;
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px monospace';
  ctx.fillStyle = '#59d68f';
  ctx.fillText('SUPER CARRY BROS.', W/2, 150 + Math.sin(t*2)*4);
  ctx.font = '16px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText('A power-law platformer. Nine of your companies are supposed to die.', W/2, 195);
  ctx.fillStyle = '#e8e6f0'; ctx.font = '14px monospace';
  const lines = [
    '←/→ or A/D ......... move',
    'SPACE (hold) ....... conviction jump — bigger check, harder landing',
    'X .................. secondary sale (cash out at 50%, forever ashamed)',
    '',
    'Collect term sheets to mark up your company. Reach the IPO flag to',
    'realize it. TVPI is the big number. DPI is the only number.',
  ];
  lines.forEach((l,i)=>ctx.fillText(l, W/2, 260 + i*24));
  ctx.fillStyle = Math.sin(t*5)>0 ? '#ffd75e' : '#6a677f';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('[ENTER] THE DAILY FUND #' + DAILY_NUM + ' — 4 companies, 2 min, same for everyone', W/2, 440);
  ctx.fillStyle = '#b8b4cc'; ctx.font = '14px monospace';
  ctx.fillText('[SPACE] full 10-year fund    ·    [B] straight to the hot deal', W/2, 470);
  ctx.restore();
}

function renderComplete() {
  ctx.save();
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  const [q, tag] = grade();
  ctx.font = 'bold 40px monospace'; ctx.fillStyle = '#59d68f';
  ctx.fillText('YOU RETURNED THE FUND', W/2, 110);
  ctx.font = '15px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText('Every round signed. The LPs got actual money. Nobody believes you.', W/2, 142);
  const tv = tvpiVal(), dp = dpiVal();
  ctx.font = 'bold 40px monospace';
  ctx.fillStyle = '#6a677f';
  ctx.fillText('TVPI ' + tv.toFixed(2) + 'x', W/2 - 180, 210);
  ctx.fillStyle = dp >= 1 ? '#59d68f' : '#ff6b81';
  ctx.fillText('DPI ' + dp.toFixed(2) + 'x', W/2 + 180, 210);
  ctx.font = '13px monospace'; ctx.fillStyle = '#6a677f';
  ctx.fillText('(paper)', W/2 - 180, 235);
  ctx.fillText('(what LPs can eat)', W/2 + 180, 235);
  ctx.font = '15px monospace'; ctx.fillStyle = '#e8e6f0';
  ctx.fillText('Best exit: ' + fmtM(bestExit()) + '   Companies burned: ' +
    (G.maxLives - G.companies) + ' of ' + G.maxLives, W/2, 280);
  ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#ffd75e';
  ctx.fillText(q, W/2, 340);
  ctx.font = '16px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText(tag, W/2, 372);
  ctx.font = '22px monospace';
  ctx.fillText(storyEmoji() || '\u{1F4ED}', W/2, 412);
  ctx.font = 'bold 15px monospace';
  ctx.fillStyle = G.copied ? '#59d68f' : '#9ecbff';
  ctx.fillText(G.copied ? 'COPIED — go paste it somewhere loud'
    : '[C] copy your fund card' + (G.daily ? ' for DAILY #' + DAILY_NUM : ''), W/2, 444);
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = Math.sin(performance.now()/200)>0 ? '#ffd75e' : '#6a677f';
  ctx.fillText('PRESS SPACE — RAISE FUND II', W/2, 480);
  ctx.restore();
}

function renderGameOver() {
  ctx.save();
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  const [q, tag] = grade();
  ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText('FUND I — FINAL', W/2, 90);


  // the reveal: TVPI vs DPI, side by side
  const tv = tvpiVal(), dp = dpiVal();
  ctx.font = 'bold 40px monospace';
  ctx.fillStyle = '#6a677f';
  ctx.fillText('TVPI ' + tv.toFixed(2) + 'x', W/2 - 180, 170);
  ctx.fillStyle = dp >= 1 ? '#59d68f' : '#ff6b81';
  ctx.fillText('DPI ' + dp.toFixed(2) + 'x', W/2 + 180, 170);
  ctx.font = '13px monospace'; ctx.fillStyle = '#6a677f';
  ctx.fillText('(paper)', W/2 - 180, 195);
  ctx.fillText('(what LPs can eat)', W/2 + 180, 195);

  ctx.font = '15px monospace'; ctx.fillStyle = '#e8e6f0';
  ctx.fillText('Best exit: ' + (G.exits.length ? fmtM(bestExit()) : 'none') +
    '   Exits: ' + G.exits.length + '   Written off: ' + fmtM(G.deadPaper), W/2, 245);

  ctx.font = 'bold 34px monospace'; ctx.fillStyle = '#ffd75e';
  ctx.fillText(q, W/2, 310);
  ctx.font = '16px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText(tag, W/2, 345);

  // the ones you didn't get. they did fine.
  if (G.antiPortfolio.length) {
    const w = G.antiPortfolio.reduce((a,b) => b.mark > a.mark ? b : a);
    ctx.font = '13px monospace'; ctx.fillStyle = '#6a677f';
    ctx.fillText('ANTI-PORTFOLIO: ' + w.name + ' last marked at ' + fmtM(w.mark) + '.', W/2, 385);
  }

  // the share card: the run as a pasteable artifact
  ctx.font = '22px monospace';
  ctx.fillText(storyEmoji() || '📭', W/2, 408);
  ctx.font = 'bold 15px monospace';
  ctx.fillStyle = G.copied ? '#59d68f' : '#9ecbff';
  ctx.fillText(G.copied ? 'COPIED — go paste it somewhere loud' :
    '[C] copy your fund card' + (G.daily ? ' for DAILY #' + DAILY_NUM : ''), W/2, 438);
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = Math.sin(performance.now()/200)>0 ? '#ffd75e' : '#6a677f';
  ctx.fillText('PRESS SPACE TO RAISE ANOTHER FUND', W/2, 472);
  ctx.restore();
}

// ---------------------------------------------------------------- input
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    keys.jump = true; keys.action = true; e.preventDefault();
  }
  if (e.code === 'KeyX') keys.sec = true;
  if (e.code === 'KeyB') keys.boss = true;
  if (e.code === 'Enter') keys.daily = true;
  if (e.code === 'KeyC') keys.copy = true;
  if (e.code === 'KeyR') keys.raise = true;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});

state = 'title';
requestAnimationFrame(frame);
</script>
</body>
</html>
