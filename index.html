<script>
'use strict';
// ============================================================================
// SUPER CARRY BROS. — vertical slice: 1-1 Demo Day
// Score = your single best exit. TVPI is the big fake number. DPI is the truth.
// ============================================================================

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 960, H = 540;

// ---------------------------------------------------------------- constants
const TILE = 36;
const GRAV = 2200;
const RUN = 340;
const JUMP_MIN = -560;        // tap ≈ 2 tiles
const JUMP_HOLD = -1600;      // conviction: extra thrust while held
const HOLD_MAX = 0.34;        // seconds of extra thrust; full hold ≈ 5 tiles
const FUND_YEARS = 10;
const SECS_PER_YEAR = 22;     // ~3.7 min fund life
const CHECK = 10;             // $10M initial check per company
const FUND_SIZE = 100;        // $100M fund
const START_RESERVES = 40;    // $40M reserves for follow-ons
const ROUND_NAMES = ['Seed','Series A','Series B','Series C','Series D','Growth'];
const ROUND_SIZE = 7;         // term sheets per round before a markup round closes
const DILUTE = 0.85;          // sprite scale per round
const FOLLOWON_COST = [0, 2, 4, 7, 11, 16]; // reserves per coin, by round

// ---- the daily fund: one seeded run, same for everyone, share the carnage ----
function mulberry32(a){a|=0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG = Math.random;                       // gameplay flavour; seeded in daily mode
const DAILY_NUM = Math.floor(Date.now()/864e5) - 20672;   // issue number
const SITE_URL = 'tmubashir.github.io/super-carry-bros';

const PASS_LINES = [
  '"We\'re going to pass, but let\'s keep in touch."',
  '"Too early for us."',
  '"Great team, wrong market."',
  '"Love it — come back at $2M ARR."',
  '"This is more of a feature than a company."',
  '"We\'re pattern-matching this to something that didn\'t work."',
];
const FOUNDER_PITCHES = [
  'Uber for lawns','Airbnb for boats','Stripe for pets','Tinder for B2B',
  'Notion for dogs','Figma for HVAC','Shopify for funerals','Slack for cults',
  'Duolingo for taxes','Palantir for weddings'
];
const LP_NAGS = [
  'LP update due.', 'LPs asking about DPI.', 'LPs "checking in".',
  'LP: "when do we see cash?"', 'LP: "interesting marks."',
  'LP: "our consultant has questions."', 'LP: "we may reduce our commitment."'
];

// ---------------------------------------------------------------- the boss
// TIER 1 VC has no health bar. He has a valuation, and it only goes up.
// Every hit you land is a bid. You can absolutely beat him. That's the trap.
const HOT_ENTRY  = 60;    // $60M post if you never bid
const BID_STEP   = 45;    // what one satisfying stomp costs you
const HOT_TARGET = 380;   // mark multiplier = HOT_TARGET / post-money
const DEAL_SECS  = 16;    // a rival is closing this round while you dance
const BID_TIME   = 4;     // what a bid actually buys: seconds. money -> time.
const RESERVE_PUSH_COST = 8;   // dry powder spendable in the room...
const RESERVE_PUSH_SECS = 3;   // ...to hold the rival off. reserves' second sink.

// ---- the mark is not the money -------------------------------------------
// Paper you BUY with reserves ("hype") inflates TVPI in full and converts to DPI
// at 15c. So the big number top-left is purchasable, and buying it consumes the
// exact capital that would have produced real value. One resource, two opposed
// goals — and the joke is charged rather than captioned.
const HYPE_CONVERT = 0.15;
const RAISE_COST = [8, 12, 18, 26, 36, 50];   // reserves to force a round, by round
const SECONDARY_RATE = 0.5;   // a buyer pays half the MARK — air included

// Published at fund start so bands are aimed at, not fallen into.
const BANDS = [
  {name:'TOP DECILE',      best:12,  dpi:2.5},
  {name:'FIRST QUARTILE',  best:7,   dpi:1.5},
  {name:'SECOND QUARTILE', best:3.5, dpi:0.8},
  {name:'THIRD QUARTILE',  best:1.5, dpi:0.3},
  {name:'FOURTH QUARTILE', best:0,   dpi:0},
];
const RIVALS = ['APEX PARTNERS','MERIDIAN','NORTHGATE','LATTICE','KESTREL CAPITAL'];

// ---------------------------------------------------------------- boss table
// Both bosses run the same three-hit state machine; this table re-skins and
// re-prices it. Every string and colour the fight prints comes from here.
const BOSSES = {
  tier1: {
    name: 'TIER 1 VC', pips: 'conviction',
    gold: '#d4af37', accent: '#16203a', ink: '#cfcbdd',
    intro: 'TIER 1 VC is standing in front of the signature.',
    clockLabel: d => d.rival + ' IS CLOSING THIS ROUND',
    volley: 'OUR PLATFORM TEAM WILL CALL YOU',
    dash: "WE'RE PRE-EMPTING",
    pound: "WE'LL LEAD",
    winded: 'WINDED — FREE HIT',
    beaten: '"Sorry — I have a board thing."',
    bidLine: (D) => fmtM(D.val) + ' — and ' + D.rival + ' has to wait.',
    loss: { headline: 'RUN OVER BY THE ROUND',

  },
  debt: {

    gold: '#8a8f9c', accent: '#2a2d36', ink: '#b9bcc6',
    intro: 'THE DEBT HOLDERS ARE ALREADY IN THE ROOM.',
    clockLabel: () => 'MATURITY IN',
    volley: 'COVENANT BREACH',
    dash: 'ACCELERATION CLAUSE',
    pound: 'FORECLOSURE',
    winded: 'WAIVER GRANTED — FREE HIT',

function bossKind() { return (G && G.mods && G.mods.boss) || 'tier1'; }
function BOSS() { return BOSSES[bossKind()]; }
const HOT_DEALS = [
  {name:'GROUNDTRUTH', pitch:'foundation models for HVAC'},
  {name:'PARABOLA',    pitch:'the Stripe for nuclear'},
  {name:'MONOLITH',    pitch:'AI agents for AI agents'},
  {name:'VELLUM',      pitch:'the Figma for litigation'},
  {name:'ARCLIGHT',    pitch:'defense tech, but friendly'},
];
const BID_BARKS = ['COMPETITIVE.','YOU\'RE IN IT.','THEY BLINKED.','MOMENTUM.','CONVICTION.'];

// ---------------------------------------------------------------- audio
const AC = window.AudioContext ? new AudioContext() : null;
function blip(freq, dur, type, vol, slide) {
  if (!AC) return;
  if (AC.state === 'suspended') AC.resume();
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
  g.gain.value = vol || 0.06;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g).connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
const sfx = {
  coin()   { blip(1180, .09, 'sine', .07); setTimeout(()=>blip(1560,.12,'sine',.06), 60); }, // slack-ish
  markup() { blip(660, .07, 'square', .05); setTimeout(()=>blip(990,.1,'square',.05), 70);
             setTimeout(()=>blip(1320,.14,'square',.05), 140); }, // cash register-ish
  jump()   { blip(300, .12, 'square', .04, 520); },
  stomp()  { blip(220, .1, 'square', .06, 90); },
  exit()   { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.18,'square',.06), i*110)); },
  death()  { /* the silence of an unanswered email */ },
  denied() { blip(140, .18, 'sawtooth', .05, 80); },
  seat()   { blip(784, .1, 'sine', .06); setTimeout(()=>blip(988,.16,'sine',.06), 90); },
};

// ---------------------------------------------------------------- level
// Terrain: # ground  = one-way platform  J bounce pad  C conveyor  G signing gate
// Pickups: t termsheet  s SAFE  U uncapped SAFE  B board seat  P pro rata  M 2&20
// Actors:  see the NPC table for enemy legends  ·  F flag  D pass door  X boss  H hot deal
// 1-1 Demo Day, rebuilt: bounce pads (J) open sky routes, a moving platform (m)
// spans the double pit, Serial Pivots (p) keep the ground honest, and the coins
// trace the jump arcs they expect you to fly.
const LEVEL_ROWS = [
"........................................................................................................................................................................",
"........................................................................................................................................................................",
"..............................................U........................................................U................................................................",
".............................................t..t.......t..t.........................................======.............................................................",
"............................................======.....======...t...............................s.s............B..................P.....................................",
"...........................s.s.................................===...t.........................=====..........===...............=====.........t.t.......................",
"..........................=====.....................................===...t...............................................M..................===........................",
".....................t.t..............................m..................===...t............................====........=====.............t.............F...............",
"....................====......................................................===........................................................===............................",
"......CCCCCCCCCC..s.s.........t.t.tg..J.....s.s.s............t.t..........g..p......s....J.............g..p.....t.t.........s.s......g............t.t.t.................",
"#########################..#############...######....###...################################...######################...#################################################",
"#########################..#############...######....###...################################...######################...#################################################",
];
// 2-1 Sand Hill Road: the anchor alley. A anchors hang from the sky over the
// paths you must cross; Z is AI ACCELERATION — immunity to everything except
// the capital structure. The anchors do not care how fast you were going.
const LEVEL_ROWS_2 = [
"....................................................................................................................................................................................",
"....................................................................................................................................................................................",
"........................................................................U...........................................................................................................",
"............................A.........................................Z.....................................A....A..................................................................",
"....................A...................A...........................=====...................A.............................................M.........................................",
"................................................................t.t...............A...................................P.................======......................................",
"...........................t.t................................======................................................=====...........................................................",
"..........................====................s.........................................m.............t...................................................t...............F.........",
"............................................=====...................................................=====...............................................=====.......................",
"............Z...t.t.t...s.s.........t.t.............g.......t.t.t.p.............s.s.t.t.................g.....s.s.s...........t.p...J.......t.t.............g.....t.t.t.............",
"##############################...#######################...###############....##################...#####################....######################...###############################",
"##############################...#######################...###############....##################...#####################....######################...###############################",
];

// The Tier 1 VC arena. Two routes to the HOT DEAL: the ground (through him)
// or the platforms (around him). Only one of them is cheap.
// Legend adds: D pass door  X boss spawn  H the hot deal
const ARENA_ROWS = [
"..................................",
"..................................",
"..................................",
"..................................",
".............................G....",
"...........=====....=====....G....",
".............................G....",
"...====......................G.F..",
".............................G....",
"...............X.............G..H.",
"##################################",
"##################################",
];
// The Recap. Same arena, two differences: no door — you cannot walk out of
// your own cap table — and a wider floor so the dash still wall-slams.
const ARENA_ROWS_2 = [
"......................................",
"......................................",
"......................................",
"......................................",
".................................G....",
".............=====....=====......G....",
".................................G....",
".....====........................G.F..",
".................................G....",
"................X................G..H.",
"######################################",
"######################################",
];
let gateOpen = false;   // the signing window. he is standing in front of it.

// ---------------------------------------------------------------- level registry
// Every playable space lives here with its rules. `mods` is where a level states
// what it does differently — that is the hook new levels hang off, so adding one
// is a map plus a mods object rather than a new branch in the update loop.
const LEVELS = {
  '1-1':   { rows: LEVEL_ROWS,   name: 'Demo Day',       mods: {} },
  'boss':  { rows: ARENA_ROWS,   name: 'The Hot Deal',   mods: {} },
  '2-1':   { rows: LEVEL_ROWS_2, name: 'Sand Hill Road', mods: { theme: 'valley' } },
  'boss2': { rows: ARENA_ROWS_2, name: 'The Recap',      mods: { theme: 'valley', boss: 'debt' } },
};
// Beating a boss is what advances the world. The fund carousel is unchanged —
// what changes is which level the next company gets dropped into.
const WORLDS = [
  { level: '1-1', boss: 'boss',  secs: 95,  exitMult: 1 },   // seed: small exits
  { level: '2-1', boss: 'boss2', secs: 110, exitMult: 3 },   // growth: the carry
];

let MAP = LEVEL_ROWS, MAP_W = LEVEL_ROWS[0].length, MAP_H = LEVEL_ROWS.length;
function setMap(rows) { MAP = rows; MAP_W = rows[0].length; MAP_H = rows.length; }
// load a level by id: sets the tilemap and exposes its modifiers as G.mods
function loadLevel(id) {
  const L = LEVELS[id];
  if (typeof G !== 'undefined' && G) { G.levelId = id; G.mods = L.mods || {}; }
  setMap(L.rows);
  return L;
}

// '=' platforms are one-way: they catch you on the way down and are not there
// on the way up, so you never bonk a shoulder on the invisible half of a tile.
const solidFull = ch => ch === '#' || ch === 'C' || (ch === 'G' && !gateOpen);
const solidTop  = ch => solidFull(ch) || ch === '=' || ch === 'J';
function tileAt(tx, ty) {
  if (tx < 0 || tx >= MAP_W) return '#';
  if (ty < 0 || ty >= MAP_H) return '.';
  return MAP[ty][tx];
}

// ---------------------------------------------------------------- game state
let state;       // 'title' | 'play' | 'dead' | 'exit' | 'gameover'
let keys = {};
let stateTimer = 0;
let G;           // run state

function newRun(runMode) {
  const daily = runMode === 'daily';
  RNG = daily ? mulberry32(DAILY_NUM * 2654435761) : Math.random;
  G = {
    daily,
    maxLives: daily ? 4 : 10,
    companies: daily ? 4 : 10,  // lives. every death is a company written off.
    companyIdx: 1,          // which company we're on (1-based, for flavor)
    exits: [],              // realized exit values ($M)
    deadPaper: 0,           // paper value written to zero (for flavor)
    reserves: daily ? 25 : START_RESERVES,
    followOnSpent: 0,
    clock: 0,               // per-world runway, set on company spawn
    toast: null, toastT: 0,
    nagIdx: 0, nextNag: 30,
    shake: 0,
    mode: 'level',
    levelId: '1-1', mods: {}, world: 0,
    resolved: 0,            // companies that have exited or died
    antiPortfolio: [],      // kept for the end screen; currently only flavour
    signed: false,          // did the current 'exit' come from signing the round?
    hotIdx: 0,
    deal: null,
    story: [],              // one glyph per outcome — this becomes the share card
    copied: false,
  };
  spawnCompany();
  state = 'play';
}

function paperTotal() { // live paper marks
  return G.company ? G.company.paper : 0;
}
function deployed() { return CHECK * G.companyIdx + G.followOnSpent; }
function dpiVal() { return G.exits.reduce((a,b)=>a+b,0) / deployed(); }
function tvpiVal() {
  return (G.exits.reduce((a,b)=>a+b,0) + paperTotal()) / deployed();
}
function bestExit() { return G.exits.length ? Math.max(...G.exits) : 0; }

function spawnCompany() {
  G.mode = 'level';
  loadLevel(WORLDS[G.world].level);   // the world you're in decides the level
  G.clock = WORLDS[G.world].secs;     // runway resets with every company
  G.nextNag = G.clock * 0.45;
  G.company = {
    paper: CHECK,           // $10M in at seed
    round: 0,               // 0 = seed
    roundCoins: 0,
    proRata: 0,             // seconds of coin doubler left
    fees: 0,                // seconds of 2&20 invincibility
    accel: 0,               // seconds of AI ACCELERATION left
    hype: 0,                // portion of the mark that is purchased air
  };
  P.x = TILE * 2.5; P.y = TILE * 8; P.vx = 0; P.vy = 0; P.dir = 1;
  P.scale = 1;
  P.onGround = false; P.holdT = 0; P.dead = false;
  cam.x = 0;
  spawnEntities();
}

// The end of every level. Your company arrives at its round and the boss is
// standing in front of the signature. Same company, same paper, same hype —
// the fight prices THIS company's exit.
function spawnBoss() {
  G.mode = 'boss';
  loadLevel(WORLDS[G.world].boss);
  gateOpen = false;
  G.deal = { val:HOT_ENTRY, bids:0, free:0,
             t:DEAL_SECS, t0:DEAL_SECS, hp:3,
             rival: RIVALS[G.world % RIVALS.length] };
  P.x = TILE * 4; P.y = TILE * 10; P.vx = 0; P.vy = 0; P.dir = 1;
  P.onGround = true; P.holdT = 0; P.dead = false;
  cam.x = 0;
  spawnEntities();
  state = 'bossintro'; stateTimer = 0;
}

// Signing the round — the flag behind the beaten boss. Bids diluted you:
// the exit realizes at HOT_ENTRY/val of what it would have been.
function signRound() {
  const C = G.company, D = G.deal;
  const dilute = HOT_ENTRY / D.val;
  const stage = WORLDS[G.world].exitMult;
  const realized = ((C.paper - C.hype) + C.hype * HYPE_CONVERT) * stage * dilute;
  G.exits.push(realized);
  G.lastExit = realized; G.lastMark = C.paper * stage; G.lastHype = C.hype * stage;
  G.lastDilute = dilute;
  G.story.push({t:'exit', m: realized / CHECK});
  G.resolved++; G.signed = true;
  burst(P.x, P.y - 30, 40, '#59d68f', 320); freeze = 8;
  sfx.exit();
  state = 'exit'; stateTimer = 0;
}

// player
const P = { x:0, y:0, vx:0, vy:0, w:26, h:34, scale:1, dir:1, onGround:false,
            holdT:0, jumpHeld:false, dead:false };
const cam = { x:0 };

// juice: particles + hit-stop. cosmetic only — never touches game state.
let fx = [], freeze = 0;
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random() * 0.7) * spd;
    fx.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.5,
             life: 0.4 + Math.random() * 0.45, col, sz: 2 + (Math.random() * 3 | 0)});
  }
  if (fx.length > 400) fx.splice(0, fx.length - 400);
}
function stepFx(dt) {
  for (const p of fx) { p.vy += 1400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);
}
function drawFx() {
  for (const p of fx) {
    ctx.globalAlpha = Math.min(1, p.life * 2.5);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- NPC table
// One entry per creature: how it spawns, thinks and draws, all in one place.
// Adding an enemy is now a table entry plus a legend character, not three edits
// scattered across update(), drawEnts() and spawnEntities().
//   spawn(x, ty)  -> the entity object          (x,y are tile-centre helpers)
//   update(e, dt) -> return a kill reason to end the company, or nothing
//   draw(e)       -> render at world coords; return false to skip
const NPC = {
  goomba: {
    legend: 'g',
    spawn: (x, ty) => ({t:'goomba', x, y: ty*TILE + TILE - 13,
      // enemies get faster as the fund ages, so replay #10 is not replay #1
      vx:-(60 + (typeof G!=='undefined' && G ? (G.resolved||0)*16 : 0)),
      w:26, h:26, dead:0}),
    update(e, dt) {
      if (e.dead) { e.dead += dt; return; }
      e.x += e.vx * dt;
      const etx0 = Math.floor((e.x - e.w/2 - 2)/TILE), etx1 = Math.floor((e.x + e.w/2 + 2)/TILE);
      const ety = Math.floor(e.y/TILE);
      const below0 = Math.floor((e.x - e.w/2)/TILE), below1 = Math.floor((e.x + e.w/2)/TILE);
      const bty = Math.floor((e.y + e.h/2 + 4)/TILE);
      if (solidFull(tileAt(e.vx<0?etx0:etx1, ety)) ||
          !solidTop(tileAt(e.vx<0?below0:below1, bty))) e.vx *= -1;
      const b = playerBox(), C = G.company;
      if (rectHit(b.x,b.y,b.w,b.h, e.x-e.w/2, e.y-e.h/2, e.w, e.h)) {
        if (P.vy > 150 && b.y + b.h < e.y + 4) {              // stomp
          e.dead = 1; P.vy = -430; sfx.stomp();
          freeze = 4; G.shake = Math.max(G.shake, 0.15);      // impact you can feel
          burst(e.x, e.y, 12, '#ff8da5', 220);
          C.paper += 1; toast('Restructured the round. +$1M mark.', 1.6);
        } else if (C.accel > 0 || C.fees > 0) {
          e.dead = 1; sfx.stomp();          // fees make you invincible to consequences
          if (C.accel > 0) {                // ...acceleration makes them a speed bump
            burst(e.x, e.y, 14, '#9ecbff', 240); freeze = 3;
            G.shake = Math.max(G.shake, 0.12);
            C.paper += 1; toast('Ran straight through it. +$1M mark.', 1.4);
          }
        } else return 'down round';
      }
    },
    draw(e) {
      if (e.dead && e.dead > 0.4) return false;
      ctx.save(); ctx.translate(e.x, e.y);
      if (e.dead) ctx.scale(1, 0.4);
      ctx.fillStyle = '#c0455a'; ctx.fillRect(-13,-13,26,26);   // a chart trending down
      ctx.strokeStyle = '#ffd9df'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(-9,-6); ctx.lineTo(-2,0); ctx.lineTo(2,-3); ctx.lineTo(9,8); ctx.stroke();
      ctx.fillStyle = '#2b1220';
      ctx.fillRect(-8,4,4,4); ctx.fillRect(4,4,4,4);
      ctx.restore();
    },
  },

  pivot: {
    legend: 'p',
    forms: [['#c9a2ff','AI'],['#8fd8ff','B2B'],['#ffd75e','D2C'],['#ff9d76','WEB3']],
    spawn: (x, ty) => ({t:'pivot', x, spawnX:x, y: ty*TILE + TILE - 13,
      groundY: ty*TILE + TILE - 13,
      vx:0, vy:0, hopT: 0.8, form: 0, w:26, h:26, dead:0}),
    update(e, dt) {
      if (e.dead) { e.dead += dt; return; }
      // Serial Pivot: hops at you, changes what it claims to be mid-air
      if (e.y >= e.groundY) {
        e.y = e.groundY; e.vy = 0; e.vx = 0;
        if ((e.hopT -= dt) <= 0) {
          e.hopT = 1.1; e.form = (e.form + 1) % 4;
          // territorial: lunges at you near its patch, hops home if it strayed
          const home = Math.abs(e.x - e.spawnX) > TILE*2.5;
          e.vy = -520;
          e.vx = (home ? (e.spawnX > e.x ? 1 : -1) : (P.x > e.x ? 1 : -1)) * 135;
        }
      } else { e.vy += GRAV * 0.8 * dt; }
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.y > e.groundY) e.y = e.groundY;
      const b = playerBox(), C = G.company;
      if (rectHit(b.x,b.y,b.w,b.h, e.x-e.w/2, e.y-e.h/2, e.w, e.h)) {
        if (P.vy > 150 && b.y + b.h < e.y + 4) {
          e.dead = 1; P.vy = -430; sfx.stomp();
          freeze = 4; G.shake = Math.max(G.shake, 0.15);
          burst(e.x, e.y, 12, '#c9a2ff', 220);
          C.paper += 2; toast('Acqui-hired the pivot. +$2M mark.', 1.6);
        } else if (C.accel > 0 || C.fees > 0) {
          e.dead = 1; sfx.stomp();
          if (C.accel > 0) {
            burst(e.x, e.y, 14, '#9ecbff', 240); freeze = 3;
            G.shake = Math.max(G.shake, 0.12);
            C.paper += 1; toast('Ran straight through it. +$1M mark.', 1.4);
          }
        } else return 'pivoted into you';
      }
    },
    draw(e) {
      if (e.dead && e.dead > 0.4) return false;
      const [col, tag] = NPC.pivot.forms[e.form];
      ctx.save(); ctx.translate(e.x, e.y);
      if (e.dead) ctx.scale(1, 0.4);
      ctx.fillStyle = col; ctx.fillRect(-13,-13,26,26);
      ctx.fillStyle = '#1a1030'; ctx.font = 'bold 9px monospace'; ctx.textAlign='center';
      ctx.fillText(tag, 0, 2);
      ctx.fillStyle = '#2b1220'; ctx.fillRect(-8,5,4,4); ctx.fillRect(4,5,4,4);
      ctx.restore();
    },
  },

  mover: {
    legend: 'm',
    spawn: (x, ty) => ({t:'mover', x, y: ty*TILE + 10, x0: x - TILE*3.5, x1: x + TILE*3.5,
      dir:1, spd:85, w:TILE*2.6}),
    update(e, dt) {
      e.x += e.dir * e.spd * dt;
      if (e.x > e.x1) { e.x = e.x1; e.dir = -1; }
      if (e.x < e.x0) { e.x = e.x0; e.dir = 1; }
      const b = playerBox(), feet = b.y + b.h;      // catch and carry the player
      if (P.vy >= 0 && feet >= e.y - 8 && feet <= e.y + 14 &&
          b.x + b.w > e.x - e.w/2 && b.x < e.x + e.w/2) {
        P.y = e.y; P.vy = 0; P.onGround = true;
        P.x += e.dir * e.spd * dt;
      }
    },
    draw(e) {
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.fillStyle = '#9c8348'; ctx.fillRect(-e.w/2, 0, e.w, 12);
      ctx.fillStyle = '#d4af37'; ctx.fillRect(-e.w/2, 0, e.w, 4);
      ctx.fillStyle = '#6b5a2e'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
      ctx.fillText(e.dir>0?'▶ BRIDGE ROUND ▶':'◀ BRIDGE ROUND ◀', 0, 10);
      ctx.restore();
    },
  },

  anchor: {
    // The liquidation-preference anchor. It hangs over the path, telegraphs,
    // and drops. It does not care about your momentum, your markups, or your
    // AI ACCELERATION — it is the capital structure, not an obstacle.
    // Fully deterministic: phase comes from the spawn column, never RNG().
    legend: 'A',
    spawn: (x, ty) => ({t:'anchor', x, ceilY: ty*TILE + 4, y: ty*TILE + 30,
      homeY: ty*TILE + 30, vy: 0, mode:'hang',
      timer: 2.2 - ((Math.floor(x/TILE) * 0.777) % 2.2), w:30, h:34}),
    update(e, dt) {
      if (e.mode === 'hang') {
        if ((e.timer -= dt) <= 0) { e.mode = 'warn'; e.timer = 0.55;
          blip(140,.12,'square',.05); }               // the tell
      } else if (e.mode === 'warn') {
        if ((e.timer -= dt) <= 0) { e.mode = 'fall'; e.vy = 0; }
      } else if (e.mode === 'fall') {
        e.vy += 2000 * dt; e.y += e.vy * dt;
        const ty = Math.floor((e.y + e.h/2) / TILE), tx = Math.floor(e.x / TILE);
        if (solidTop(tileAt(tx, ty))) {
          e.y = ty*TILE - e.h/2;
          e.mode = 'smash'; e.timer = 0.9;
          G.shake = Math.max(G.shake, 0.25); freeze = 3;
          burst(e.x, e.y + e.h/2, 14, '#b8b4cc', 200);
          blip(70,.2,'sawtooth',.07);
        }
      } else if (e.mode === 'smash') {
        if ((e.timer -= dt) <= 0) e.mode = 'retract';
      } else if (e.mode === 'retract') {
        e.y -= 260 * dt;
        if (e.y <= e.homeY) { e.y = e.homeY; e.mode = 'hang'; e.timer = 2.2; }
      }
      // lethal only while falling or resting in the crater
      if (e.mode === 'fall' || e.mode === 'smash') {
        const b = playerBox();
        if (rectHit(b.x, b.y, b.w, b.h, e.x - 15, e.y - 17, 30, 34))
          return { why: 'anchor', override: {
            headline: 'CRAMMED DOWN',
            line: "you were crammed down to commons and liquidation preference didn't clear",
          } };
      }
    },
    draw(e) {
      // warn: dashed drop-line down the column it will fall through
      if (e.mode === 'warn') {
        let gy = H;
        for (let ty = Math.floor(e.y/TILE); ty < MAP_H; ty++)
          if (solidTop(tileAt(Math.floor(e.x/TILE), ty))) { gy = ty*TILE; break; }
        ctx.strokeStyle = 'rgba(255,107,129,0.65)'; ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y + e.h/2); ctx.lineTo(e.x, gy); ctx.stroke();
        ctx.setLineDash([]);
      }
      const shakeX = e.mode === 'warn' ? Math.sin(performance.now()/24) * 2.5 : 0;
      ctx.save(); ctx.translate(e.x + shakeX, e.y);
      // chain of links up to the ceiling, shortening as it falls
      ctx.strokeStyle = '#5a5f6b'; ctx.lineWidth = 3;
      for (let ly = e.ceilY - e.y; ly < -e.h/2; ly += 9) {
        ctx.beginPath(); ctx.ellipse(0, ly + 4, 3, 4.5, 0, 0, 7); ctx.stroke();
      }
      // a real ship's anchor: ring, stock, shank, curved arms, two flukes
      ctx.strokeStyle = '#22252c'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, -e.h/2 + 3, 4, 0, 7); ctx.stroke();     // ring
      ctx.fillStyle = '#22252c';
      ctx.fillRect(-9, -e.h/2 + 7, 18, 3);                               // stock
      ctx.fillRect(-2, -e.h/2 + 7, 4, e.h - 12);                         // shank
      ctx.strokeStyle = '#22252c'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, e.h/2 - 12, 11, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
      ctx.fillStyle = '#22252c';                                         // flukes
      ctx.beginPath(); ctx.moveTo(-11, e.h/2 - 8); ctx.lineTo(-17, e.h/2 - 15);
      ctx.lineTo(-8, e.h/2 - 15); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(11, e.h/2 - 8); ctx.lineTo(17, e.h/2 - 15);
      ctx.lineTo(8, e.h/2 - 15); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
  },
};

// entities (coins, enemies, founders, flag)
let ents = [];
function spawnEntities() {
  ents = [];
  for (let ty = 0; ty < MAP_H; ty++) for (let tx = 0; tx < MAP_W; tx++) {
    const ch = MAP[ty][tx], x = tx*TILE + TILE/2, y = ty*TILE + TILE/2;
    if (ch === 't') ents.push({t:'coin', kind:'term', x, y, r:10, val:2,  taken:false});
    if (ch === 's') ents.push({t:'coin', kind:'safe', x, y, r:8,  val:1,  taken:false});
    if (ch === 'U') ents.push({t:'coin', kind:'uncapped', x, y, r:13, val:12, taken:false});
    if (ch === 'B') ents.push({t:'coin', kind:'seat', x, y, r:12, taken:false});
    if (ch === 'P') ents.push({t:'coin', kind:'prorata', x, y, r:11, taken:false});
    if (ch === 'M') ents.push({t:'coin', kind:'fees', x, y, r:11, taken:false});
    if (ch === 'Z') ents.push({t:'coin', kind:'accel', x, y, r:13, taken:false});
    // enemies come from the NPC table, keyed by their legend character
    for (const type in NPC) if (NPC[type].legend === ch) ents.push(NPC[type].spawn(x, ty));
    if (ch === 'F' && ty === 7) ents.push({t:'flag', x: tx*TILE + TILE/2, y: ty*TILE});
    if (ch === 'X') ents.push({t:'boss', x, y:(ty+1)*TILE, groundY:(ty+1)*TILE,
                               face:-1, vx:0, vy:0, stun:0, mode:'idle',
                               timer:1.4, next:'pound', shots:0, shotT:0, tx:x,
                               shoveT:0, hp:3, defeated:0});
    }
  // founders on the demo-day conveyor
  if (MAP.some(r => r.indexOf('C') >= 0))
    for (let i = 0; i < 5; i++)
      ents.push({t:'founder', x: TILE*(6.5 + i*2), baseX: TILE*(6.5+i*2), y: TILE*9.5-14,
                 pitch: (RNG()*FOUNDER_PITCHES.length)|0, pt: i*0.8});
}

// ---------------------------------------------------------------- helpers
function toast(msg, secs) { G.toast = msg; G.toastT = secs || 2.2; }
function banner(txt) { G.banner = txt; G.bannerT = 1.4; }
function fmtM(v) { return '$' + (v>=1000 ? (v/1000).toFixed(1)+'B' : v.toFixed(0)+'M'); }
function rectHit(ax,ay,aw,ah, bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
function playerBox() {
  const w = P.w*P.scale, h = P.h*P.scale;
  return {x: P.x - w/2, y: P.y - h, w, h};
}

// ---------------------------------------------------------------- update
let last = 0;
function frame(ts) {
  const dt = Math.min((ts - last)/1000, 0.033); last = ts;
  if (freeze > 0) { freeze--; render(dt); requestAnimationFrame(frame); return; }  // hit-stop
  update(dt); stepFx(dt); render(dt);
  requestAnimationFrame(frame);
}

function update(dt) {
  stateTimer += dt;
  if (state === 'title') {
    if (keys.boss) {                       // straight to the boss room
      keys.boss = false; keys.action = false;
      newRun(); spawnBoss(); return;
    }
    if (keys.daily) { keys.daily = false; keys.action = false; newRun('daily'); return; }
    if (keys.action) { keys.action = false; newRun(); }
    return;
  }
  if (state === 'gameover') {
    if (keys.copy) { keys.copy = false; copyShare(); }
    if (keys.action && stateTimer > 1.2) { keys.action=false; state='title'; }
    return;
  }
  if (state === 'bossintro') {
    if (stateTimer > 3.6 || (keys.action && stateTimer > 0.6)) { keys.action=false; state='play'; }
    return;
  }
  if (state === 'complete') {
    if (keys.copy) { keys.copy = false; copyShare(); }
    if (keys.action && stateTimer > 1.5) { keys.action = false; state = 'title'; }
    return;
  }
  if (state === 'dead' || state === 'exit') {
    const wait = state==='dead' ? 2.4 : 3.0;
    if (stateTimer > wait || (keys.action && stateTimer > 1.0)) {
      keys.action = false;
      if (state === 'exit' && G.signed) {
        // the round is signed: the world changes, or the fund is returned
        G.signed = false;
        if (G.world + 1 >= WORLDS.length) { state = 'complete'; stateTimer = 0; return; }
        G.world++; G.companyIdx++; spawnCompany(); state = 'play'; return;
      }
      // a death or a secondary: next company retries the SAME world
      if (G.companies <= 0) { endRun(); return; }
      G.companyIdx++; spawnCompany(); state = 'play';
    }
    return;
  }

  // ---- runway: this company's clock through the level. dying of it is a death.
  if (G.mode === 'level') {
    G.clock -= dt;
    G.nextNag -= dt;
    if (G.nextNag <= 0) {
      toast('📩 ' + LP_NAGS[G.nagIdx++ % LP_NAGS.length], 2.6);
      G.nextNag = Math.max(8, G.clock * 0.5);
    }
    if (G.clock <= 0) {
      G.clock = 0;
      return killCompany('ran out of runway', {
        headline: 'OUT OF RUNWAY',
        line: 'the round was right there. payroll was not.',
      });
    }
  }

  const C = G.company;
  if (C) { if (C.proRata > 0) C.proRata -= dt; if (C.fees > 0) C.fees -= dt;
           if (C.accel > 0) C.accel -= dt; }
  if (G.toastT > 0) { G.toastT -= dt; if (G.toastT <= 0) G.toast = null; }
  if (G.bannerT > 0) { G.bannerT -= dt; if (G.bannerT <= 0) G.banner = null; }
  if (G.shake > 0) G.shake -= dt;

  // ---- input / physics
  let ax = 0;
  if (keys.left)  { ax -= 1; P.dir = -1; }
  if (keys.right) { ax += 1; P.dir = 1; }
  // ground momentum: accelerate into a run, skid out of it
  { const tgt = ax * RUN * (C && C.accel > 0 ? 1.8 : 1),
          rate = (ax === 0 ? 5200 : 3000) * dt;
    P.vx += Math.max(-rate, Math.min(rate, tgt - P.vx)); }

  // conviction jump: tap = small check, hold = big check, harder landing
  P.coyoteT = P.onGround ? 0.09 : Math.max(0, (P.coyoteT||0) - dt);
  P.jBufT = (keys.jump && !P.jHeldPrev) ? 0.10 : Math.max(0, (P.jBufT||0) - dt);
  P.jHeldPrev = !!keys.jump;
  if ((keys.jump || P.jBufT > 0) && (P.onGround || P.coyoteT > 0)) {
    P.vy = JUMP_MIN; P.onGround = false; P.coyoteT = 0; P.jBufT = 0; P.holdT = 0; P.jumpHeld = true; sfx.jump();
  }
  if (P.jumpHeld && keys.jump && P.holdT < HOLD_MAX && P.vy < 0) {
    P.vy += JUMP_HOLD * dt; P.holdT += dt;
  }
  if (!keys.jump) P.jumpHeld = false;

  P.vy += GRAV * dt;
  if (P.vy > 900) P.vy = 900;

  moveAndCollide(dt);

  // conveyor push (demo day belt)
  {
    const b = playerBox();
    const tx = Math.floor((b.x+b.w/2)/TILE), ty = Math.floor((b.y+b.h+2)/TILE);
    if (P.onGround && tileAt(tx,ty) === 'C') P.x += 55*dt;
    // running over a bounce pad launches you — it's a boost strip, not decor
    if (P.onGround && tileAt(tx, Math.floor((b.y+b.h-2)/TILE)) === 'J') {
      P.vy = -1120; P.onGround = false; P.holdT = HOLD_MAX; P.jumpHeld = false;
      burst(P.x, P.y, 10, '#9ecbff', 200); sfx.jump(); blip(700,.12,'square',.05,1200);
    }
  }

  // fell off the map
  if (P.y > H + 120) return killCompany('down round → mark to zero',
    G.mode === 'boss' ? BOSS().loss : null);

  // ---- the end of the level is the round, and he is standing in front of it
  if (G.mode === 'level' && P.x > (MAP_W - 1.5) * TILE) return spawnBoss();

  // ---- the boss owns the rest of the frame
  if (G.mode === 'boss') return updateBoss(dt);

  // ---- raise a round: buy the big number with the capital that makes the real one
  if (keys.raise && C) {
    keys.raise = false;
    const cost = RAISE_COST[Math.min(C.round, RAISE_COST.length-1)];
    if (C.round >= ROUND_NAMES.length-1) {
      sfx.denied(); toast('No one left to mark you up.', 1.8);
    } else if (G.reserves < cost) {
      sfx.denied(); toast('NO DRY POWDER — you cannot manufacture a round.', 2.2);
    } else {
      G.reserves -= cost; G.followOnSpent += cost;
      // a 2.5x mark: the number leaps, which is the point. Every cent of it is air.
      const bump = C.paper * 1.5;
      C.paper += bump; C.hype += bump;
      C.round++; C.roundCoins = 0;
      P.scale *= DILUTE;                   // and you own less of it
      sfx.markup(); burst(P.x, P.y - 30, 16, '#ffd75e', 240);
      toast(ROUND_NAMES[C.round] + ' "closed". Marked to ' + fmtM(C.paper) +
            '. You own less of a bigger number.', 3);
    }
  }

  // ---- secondaries: a buyer pays half the MARK, air included. Sometimes right.
  if (keys.sec && C) {
    keys.sec = false;
    const v = C.paper * SECONDARY_RATE;
    G.exits.push(v);
    G.story.push({t:'sec'});
    G.lastExit = v; G.lastMark = C.paper; G.lastHype = C.hype;
    toast('SECONDARY: sold the mark at ' + (SECONDARY_RATE*100) + '%. ' +
          fmtM(v) + ' realized.' + (C.hype > (C.paper-C.hype)*1.4
            ? ' You sold the story before it was marked down.' : ' Coward.'), 3.2);
    sfx.markup();
    retireCompany('exit');
    return;
  }

  // ---- entities
  for (const e of ents) {
    if (e.t === 'coin' && !e.taken) {
      const b = playerBox();
      if (rectHit(b.x,b.y,b.w,b.h, e.x-e.r, e.y-e.r, e.r*2, e.r*2)) collect(e);
    } else if (NPC[e.t]) {
      // update returns a kill reason string, or {why, override} for deaths
      // that carry their own card text
      const why = NPC[e.t].update(e, dt);
      if (why) return killCompany(why.why || why, why.override);
    } else if (e.t === 'founder') {
      e.pt += dt;
      e.x = e.baseX + Math.sin(e.pt*0.9)*6;
    }
  }
}

function moveAndCollide(dt) {
  const b = playerBox();
  // horizontal
  P.x += P.vx * dt;
  {
    const nb = playerBox();
    const ty0 = Math.floor(nb.y/TILE), ty1 = Math.floor((nb.y+nb.h-1)/TILE);
    if (P.vx > 0) {
      const tx = Math.floor((nb.x+nb.w)/TILE);
      for (let ty=ty0; ty<=ty1; ty++) if (solidFull(tileAt(tx,ty))) { P.x = tx*TILE - nb.w/2; break; }
    } else if (P.vx < 0) {
      const tx = Math.floor(nb.x/TILE);
      for (let ty=ty0; ty<=ty1; ty++) if (solidFull(tileAt(tx,ty))) { P.x = (tx+1)*TILE + nb.w/2; break; }
    }
  }
  // vertical
  const prevFeet = P.y;              // playerBox().y + h === P.y
  P.y += P.vy * dt;
  P.onGround = false;
  {
    const nb = playerBox();
    const tx0 = Math.floor((nb.x+2)/TILE), tx1 = Math.floor((nb.x+nb.w-3)/TILE);
    if (P.vy > 0) {
      const ty = Math.floor((nb.y+nb.h)/TILE);
      for (let tx=tx0; tx<=tx1; tx++) {
        const ch = tileAt(tx,ty);
        if (!solidTop(ch)) continue;
        if (ch === '=' && prevFeet > ty*TILE + 2) continue;   // one-way: came from below
        if (ch === 'J') {                                     // bounce pad: term-sheet trampoline
          P.y = ty*TILE; P.vy = -1120; P.onGround = false;
          P.holdT = HOLD_MAX; P.jumpHeld = false;
          burst(P.x, P.y, 10, '#9ecbff', 200); sfx.jump(); blip(700,.12,'square',.05,1200);
          break;
        }
        // conviction landing: big holds land hard
        // every real fall punctuates, scaled to how hard you came down
        if (P.vy > 430) { G.shake = Math.max(G.shake, Math.min(0.22, P.vy/4200));
                          burst(P.x, P.y, 4, '#584d78', 90); }
        P.y = ty*TILE; P.vy = 0; P.onGround = true; break;
      }
    } else if (P.vy < 0) {
      const ty = Math.floor(nb.y/TILE);
      for (let tx=tx0; tx<=tx1; tx++) if (solidFull(tileAt(tx,ty))) {
        P.y = (ty+1)*TILE + nb.h; P.vy = 0; break;
      }
    }
  }
  // camera
  const target = P.x - W*0.38;
  cam.x += (target - cam.x) * Math.min(1, dt*6);
  cam.x = Math.max(0, Math.min(cam.x, MAP_W*TILE - W));
}

// ---------------------------------------------------------------- the boss
// Three ways out of this room: bid him up, go around him, or walk out the door.
// Two of them are free. The satisfying one is not.
function updateBoss(dt) {
  const D = G.deal;
  if (ents.length > 40) ents = ents.filter(e => !e.gone);

  // Standing off is not a strategy: the founder reads distance as disinterest and
  // the rival closes faster. Patience has to be played IN the room, not across it —
  // which is what makes waiting for the opening a skill instead of a wait.
  const bossRef = ents.find(e => e.t === 'boss');
  D.dis = !!(bossRef && !bossRef.defeated && Math.abs(P.x - bossRef.x) > 300);
  D.t -= dt * (D.dis ? 2.6 : 1);
  if (D.t <= 0) return killCompany('the round closed', BOSS().loss);

  const pb = playerBox();

  // reserves get a second use: burn dry powder to slow the rival instead of
  // spending it on follow-ons later. Now "hold or deploy" weighs two real things.
  if (keys.sec) {
    keys.sec = false;
    if (G.reserves >= RESERVE_PUSH_COST) {
      G.reserves -= RESERVE_PUSH_COST; G.followOnSpent += RESERVE_PUSH_COST;
      D.t += RESERVE_PUSH_SECS; D.t0 = Math.max(D.t0, D.t);
      sfx.seat(); burst(P.x, P.y - 30, 12, '#9ecbff', 200);
      toast('Burned $' + RESERVE_PUSH_COST + 'M of dry powder. ' + D.rival +
            ' holds ' + RESERVE_PUSH_SECS + 's.', 2);
    } else { sfx.denied(); toast('No dry powder left to burn.', 1.6); }
  }


  // TIER 1 VC, rebuilt as a real fight: every attack telegraphs, contact while
  // he strolls is a shove (not a death), and the skill is baiting the dash —
  // he wall-slams into a long free-hit window. Phases escalate as hp drops.
  const b = ents.find(e => e.t === 'boss');
  if (b && b.defeated) {
    b.defeated += dt;                                // takes a call, walks off
    b.x += b.face * -90 * dt;
  } else if (b) {
    const sp = 1 + (3 - b.hp) * 0.18;                // phase speed-up
    if (b.shoveT > 0) b.shoveT -= dt;
    if (b.stun > 0) {
      b.stun -= dt; b.x += b.vx * dt; b.vx *= 0.90;
      if (b.y < b.groundY) { b.vy += GRAV*dt; b.y = Math.min(b.groundY, b.y + b.vy*dt); }
    } else if (b.mode === 'idle') {
      b.face = P.x < b.x ? -1 : 1;
      b.x += b.face * 70 * sp * dt;
      if ((b.timer -= dt) <= 0) {
        const d = Math.abs(P.x - b.x);
        b.next = d > 380 ? 'volley' : d > 130 ? 'dash' : 'pound';
        b.mode = 'telegraph'; b.timer = 0.5 / sp;
        // the attack announces itself in the boss's own vocabulary
        ents.push({t:'float', x: b.x, y: b.y - 150, txt: BOSS()[b.next], life: 0.9,
                   col: BOSS().gold});
        blip(300,.15,'square',.05);
      }
    } else if (b.mode === 'telegraph') {             // the tell: read it, pick your answer
      if ((b.timer -= dt) <= 0) {
        b.mode = b.next;
        // readable late: a human reading the tell at 133ms still has an out
        if (b.mode === 'dash')   { b.vx = b.face * 430 * sp; b.timer = 0.78; }
        if (b.mode === 'volley') { b.shots = b.hp <= 1 ? 5 : 3; b.shotT = 0; }
        if (b.mode === 'pound')  { b.vy = -700; b.tx = P.x; }
      }
    } else if (b.mode === 'dash') {                  // "we're pre-empting"
      b.x += b.vx * dt; b.timer -= dt;
      const atWall = b.x <= TILE*2.6 || b.x >= TILE*(MAP_W - 7.1);   // map-relative, both arenas
      if (atWall) {                                  // baited into the wall: long opening
        b.mode = 'winded'; b.timer = 2.8; b.vx = 0;
        G.shake = 0.32; freeze = 5; blip(80,.3,'sawtooth',.08);
        burst(b.x, b.y - 60, 26, '#cfcbdd', 300);    // term sheets everywhere
      } else if (b.timer <= 0) {
        b.mode = 'winded'; b.timer = 1.1; b.vx = 0;  // even a whiff leaves a short opening
      }
    } else if (b.mode === 'volley') {                // "our platform team will call you"
      b.shotT -= dt;
      if (b.shotT <= 0 && b.shots > 0) {
        b.shots--; b.shotT = 0.22;
        const dx = P.x - b.x;
        ents.push({t:'proj', x: b.x + b.face*30, y: b.y - 70,
                   vx: Math.max(-460, Math.min(460, dx*(1.1 + 0.3*(b.shots%3)))),
                   vy: -330 - 70*(b.shots%2)});
        blip(520,.08,'square',.05,240);
      }
      if (b.shots <= 0 && b.shotT <= 0) { b.mode = 'idle'; b.timer = 1.4 / sp; }
    } else if (b.mode === 'pound') {                 // "we'll lead"
      b.vy += GRAV*0.9*dt; b.y += b.vy*dt;
      b.x += (b.tx - b.x) * dt * 1.2;                // drifts toward where you were
      if (b.y >= b.groundY) {
        b.y = b.groundY; b.vy = 0; b.mode = 'winded'; b.timer = 2.2;
        G.shake = 0.3; freeze = 4; blip(90,.25,'sawtooth',.07);
        const wv = b.hp <= 2 ? 340 : 300;
        ents.push({t:'wave', x:b.x, y:b.groundY, vx: wv});
        ents.push({t:'wave', x:b.x, y:b.groundY, vx:-wv});
      }
    } else if (b.mode === 'winded') {                // the opening. hit him here. it's free.
      if ((b.timer -= dt) <= 0) { b.mode = 'idle'; b.timer = 1.2 / sp; }
    }
    b.x = Math.max(TILE*2.5, Math.min(TILE*(MAP_W - 7), b.x));

    const BW = 66, BH = 100, bx = b.x - BW/2, by = b.y - BH;
    if (rectHit(pb.x,pb.y,pb.w,pb.h, bx,by,BW,BH)) {
      if (P.vy > 120 && pb.y + pb.h < by + 34) hitBoss(b);
      else if (b.mode === 'dash' && b.stun <= 0)
        return killCompany('run over mid-pre-empt', BOSS().loss);
      else if (b.stun <= 0 && b.mode !== 'winded') {
        // strolling contact is a shove, not a death — deaths come from attacks
        P.x = b.x + (P.x < b.x ? -1 : 1) * (BW/2 + 22);
        P.vy = -240; P.vx = 0;
        if (b.shoveT <= 0) { b.shoveT = 2; toast('"Great to see you." He moves through you.', 1.5); }
      }
    }
  }

  for (const e of ents) {
    if (e.gone) continue;
    if (e.t === 'proj') {
      e.vy += GRAV*0.55*dt; e.x += e.vx*dt; e.y += e.vy*dt;
      if (e.y > H + 80 || e.x < -60 || e.x > MAP_W*TILE + 60) e.gone = true;
      else if (rectHit(pb.x,pb.y,pb.w,pb.h, e.x-9,e.y-11,18,22))
        return killCompany('pre-empted', BOSS().loss);
    } else if (e.t === 'wave') {
      e.x += e.vx*dt;
      if (e.x < -60 || e.x > MAP_W*TILE + 60) e.gone = true;
      else if (rectHit(pb.x,pb.y,pb.w,pb.h, e.x-16,e.y-22,32,22))
        return killCompany('foreclosed on', BOSS().loss);
    } else if (e.t === 'float') {
      e.y -= 46*dt; if ((e.life -= dt) <= 0) e.gone = true;
    } else if (e.t === 'flag') {
      if (pb.x + pb.w > e.x - 6) return signRound();    // the gate is open. sign it.
    }
  }
}

// Three hits and he's out. What each hit COSTS is the whole game:
// catch him winded and it's free; jump on him any other time and you just bid.
function hitBoss(b) {
  const D = G.deal;
  const free = b.mode === 'winded';
  b.hp--; D.hp = b.hp;
  b.stun = 0.95; b.vx = (P.x < b.x ? 1 : -1) * 340;
  b.mode = 'idle'; b.timer = 1.4;      // he recomposes — one free hit per opening
  if (b.y < b.groundY) b.vy = 300;     // knocked out of a pound mid-air
  P.vy = -470; G.shake = 0.18; freeze = 6;
  burst(b.x, b.y - 60, 18, free ? '#59d68f' : '#ffd75e', 260);

  if (free) {
    D.free++;
    sfx.stomp();
    ents.push({t:'float', x: b.x + 58, y: b.y - 104, txt: 'FREE', life: 1.1, col:'#59d68f'});
    toast('HE BLINKED. No markup.', 1.6);
  } else {
    // paying up buys you time: the founder holds the process open for a bidder
    D.bids++; D.val += BID_STEP; D.t += BID_TIME; D.t0 = Math.max(D.t0, D.t);
    sfx.markup();
    ents.push({t:'float', x: b.x + 58, y: b.y - 104, txt: '+' + fmtM(BID_STEP), life: 1.1});
    ents.push({t:'float', x: b.x + 58, y: b.y - 132, txt: '+' + BID_TIME + 's', life: 1.1, col:'#9ecbff'});
    toast(BID_BARKS[(D.bids-1) % BID_BARKS.length] + '  ' + BOSS().bidLine(D), 1.8);
  }

  if (b.hp <= 0) {
    b.defeated = 0.001; gateOpen = true;
    sfx.exit();
    toast('"We\'re out at this price." THE SIGNING WINDOW IS OPEN.', 3);
  }
}

// ---------------------------------------------------------------- economy
function collect(e) {
  const C = G.company;
  if (e.kind === 'seat') {
    e.taken = true; G.companies++; sfx.seat();
    toast('BOARD SEAT — one more company in the portfolio.', 2.4); return;
  }
  if (e.kind === 'prorata') {
    e.taken = true; C.proRata = 9; P.scale = Math.min(1, P.scale/DILUTE); sfx.seat();
    toast('PRO RATA — ownership defended. Marks 2x for 9s.', 2.4); return;
  }
  if (e.kind === 'fees') {
    e.taken = true; C.fees = 7; sfx.seat();
    toast('2 AND 20 — fees keep you alive regardless of performance.', 2.6); return;
  }
  if (e.kind === 'accel') {
    e.taken = true; C.accel = 9;
    sfx.markup(); burst(e.x, e.y, 20, '#9ecbff', 260); freeze = 4;
    banner('AI ACCELERATION');
    return;
  }
  // term sheets / SAFEs: follow-on pricing — later rounds cost reserves per coin
  const cost = FOLLOWON_COST[Math.min(C.round, FOLLOWON_COST.length-1)];
  if (cost > 0) {
    if (G.reserves < cost) {
      if (!e.denied) { e.denied = true; sfx.denied();
        toast('NO RESERVES — you cannot follow on. (You blew it at seed.)', 2.6); }
      return; // coin stays. you just can't have it.
    }
    G.reserves -= cost;
    G.followOnSpent += cost;
  }
  e.taken = true;
  // up rounds mark harder; a hot deal you got cheap marks hardest of all
  const mult = (C.proRata > 0 ? 2 : 1) * (1 + C.round * 0.6) * (C.mult || 1);
  C.paper += e.val * mult;
  C.roundCoins++;
  burst(e.x, e.y, 6, '#ffd75e', 130);
  sfx.coin();
  if (C.roundCoins >= ROUND_SIZE && C.round < ROUND_NAMES.length-1) {
    C.round++; C.roundCoins = 0;
    P.scale *= DILUTE; // dilution
    sfx.markup();
    const nextCost = FOLLOWON_COST[Math.min(C.round, FOLLOWON_COST.length-1)];
    toast(ROUND_NAMES[C.round] + ' closed! Marked up. You own less. ' +
          'Follow-ons now $' + nextCost + 'M each.', 3);
  }
}

// `override` = {headline, line} for deaths that have their own thing to say.
// Without it a death picks a random pass line, which is the normal case.
function killCompany(why, override) {
  const C = G.company;
  G.deadPaper += C.paper;
  G.companies--; G.resolved++;
  G.story.push({t:'dead'});
  G.lastPass = PASS_LINES[(RNG()*PASS_LINES.length)|0];
  G.lastWhy = why;
  G.deathOverride = override || null;
  sfx.death();
  state = 'dead'; stateTimer = 0;
}
function retireCompany(mode) {
  G.companies--; G.resolved++;
  state = mode; stateTimer = 0;
}
function endRun() { state = 'gameover'; stateTimer = 0; }

// ---- the share card: the run compressed into one pasteable block ----
function storyEmoji() {
  return G.story.map(s =>
    s.t==='ko' ? '☠️' : s.t==='dead' ? '💀' : s.t==='sec' ? '🏃'
    : s.t==='pass' ? '🙅' : s.t==='lost' ? '😤'
    : s.m >= 10 ? '🦄' : s.m >= 4 ? '🚀' : '📈').join('');
}
function shareText() {
  const [q] = grade();
  return 'SUPER CARRY BROS. ' + (G.daily ? '#' + DAILY_NUM : '(free play)') + '\n'
    + (storyEmoji() || '📭') + '\n'
    + 'DPI ' + dpiVal().toFixed(2) + 'x · ' + q + '\n'
    + (G.exits.length ? 'best exit ' + fmtM(bestExit()) + ' ('
        + (bestExit()/CHECK).toFixed(1) + 'x)\n' : '')
    + SITE_URL;
}
function copyShare() {
  const txt = shareText();
  try {
    if (typeof navigator !== 'undefined' && navigator.clipboard)
      navigator.clipboard.writeText(txt);
    G.copied = true;
  } catch (e) { /* clipboard blocked; text is still on screen */ }
}

// grade: power law — only your best exit matters
const BAND_TAG = {
  'TOP DECILE':      'LPs return your calls first. Fund II is oversubscribed.',
  'FIRST QUARTILE':  'One company carried the fund. It always does.',
  'SECOND QUARTILE': 'Respectable. The word "solid" will haunt you.',
  'THIRD QUARTILE':  'You will raise Fund III anyway.',
  'FOURTH QUARTILE': 'Your TVPI was beautiful. Nobody could eat it.',
};
// Bands are published (see BANDS) so the player can aim at one mid-run.
function bandFor(best, dpi) {
  return BANDS.find(b => best >= b.best && dpi >= b.dpi) || BANDS[BANDS.length-1];
}
function grade() {
  const b = bandFor(bestExit()/CHECK, dpiVal());
  return [b.name, BAND_TAG[b.name]];
}
// the band immediately above where you currently sit, for the HUD pace line
function nextBand() {
  const cur = bandFor(bestExit()/CHECK, dpiVal());
  const i = BANDS.indexOf(cur);
  return i > 0 ? BANDS[i-1] : null;
}

// ---------------------------------------------------------------- render
function render(dt) {
  ctx.save();
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0,0,W,H);

  if (state === 'title') return renderTitle();
  if (state === 'gameover') { ctx.restore(); return renderGameOver(); }
  if (state === 'complete') { ctx.restore(); return renderComplete(); }

  if (G.shake > 0) ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);

  // sky gradient + skyline — a different time of day per world, not just hues
  const grad = ctx.createLinearGradient(0,0,0,H);
  if (theme() === 'valley') { grad.addColorStop(0,'#bcd9ef'); grad.addColorStop(1,'#f0dfbe'); }
  else                      { grad.addColorStop(0,'#1a2340'); grad.addColorStop(1,'#2b2352'); }
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  drawSkyline();

  ctx.save();
  ctx.translate(-Math.round(cam.x), 0);
  drawTiles();
  drawEnts();
  drawFx();
  if (state !== 'dead') drawPlayer();
  ctx.restore();

  drawHUD();

  if (state === 'dead') drawDeathCard();
  if (state === 'exit') drawExitCard();
  if (state === 'bossintro') drawBossIntro();
  ctx.restore();
}

function drawBossIntro() {
  ctx.fillStyle = 'rgba(13,15,26,0.88)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = bossKind()==='debt' ? '#c0455a' : '#ffd75e'; ctx.font = 'bold 32px monospace';
  ctx.fillText(bossKind()==='debt' ? 'THE RECAP' : 'THE ROUND', W/2, H/2 - 82);
  ctx.fillStyle = '#e8e6f0'; ctx.font = 'bold 19px monospace';
  ctx.fillText('Your company made it to the signature.', W/2, H/2 - 44);
  ctx.fillStyle = '#ff6b81'; ctx.font = 'bold 17px monospace';
  ctx.fillText(BOSS().intro, W/2, H/2 - 12);
  // the objective, in one box
  ctx.strokeStyle = '#584d78'; ctx.lineWidth = 1;
  ctx.strokeRect(W/2 - 300, H/2 + 8, 600, 96);
  ctx.fillStyle = '#e8e6f0'; ctx.font = 'bold 14px monospace';
  ctx.fillText('OBJECTIVE: knock him out of the deal — 3 hits — then sign behind him.', W/2, H/2 + 32);
  ctx.fillStyle = '#59d68f'; ctx.font = '13px monospace';
  ctx.fillText('Hits while ' + BOSS().winded.split(' — ')[0] + ' are FREE.', W/2, H/2 + 56);
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('Any other hit is a bid: +' + fmtM(BID_STEP) + ' on the price, paid out of YOUR exit.',
               W/2, H/2 + 78);
  ctx.fillStyle = '#6a677f'; ctx.font = '13px monospace';
  ctx.fillText((bossKind()==='debt' ? 'The note matures in ' : G.deal.rival + ' signs in ') +
               DEAL_SECS + 's. Lose the room, lose the company.', W/2, H/2 + 124);
}

function theme() { return (G && G.mods && G.mods.theme) || 'night'; }
// per-theme tile palette. Platforms stay wood-gold in both so the one-way
// rule keeps reading the same way across worlds.
const TILE_PAL = {
  night:  { gTop:'#584d78', gBody:'#3d3554', gSeam:'#332c47',
            pTop:'#9c8348', pBody:'#6b5a2e', jBase:'#31436b', jCoil:'#9ecbff' },
  valley: { gTop:'#c9c2b4', gBody:'#a89f8d', gSeam:'#8f8676',
            pTop:'#9c8348', pBody:'#6b5a2e', jBase:'#5b7ba6', jCoil:'#dff0ff' },
};

function drawSkyline() {
  if (theme() === 'valley') return drawSkylineValley();
  drawSkylineNight();
}
function drawSkylineNight() {
  ctx.fillStyle = '#141a30';
  for (let i = 0; i < 22; i++) {
    const x = ((i*137 - cam.x*0.25) % (W+200)) - 100;
    const h = 60 + (i*53)%140;
    ctx.fillRect(x, H-120-h, 54, h+40);
  }
  // sand hill road sign vibes
  ctx.fillStyle = '#0f1426';
  for (let i = 0; i < 14; i++) {
    const x = ((i*211 - cam.x*0.5) % (W+300)) - 150;
    const h = 40 + (i*97)%90;
    ctx.fillRect(x, H-90-h, 80, h+30);
  }
}
function drawSkylineValley() {
  // golden-brown hills: two overlapping sine ridges, far parallax
  for (const [amp, base, col, rate] of [[26, H-190, '#d8c08a', 0.18], [34, H-165, '#c4a869', 0.25]]) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const wx = x + cam.x*rate;
      ctx.lineTo(x, base + Math.sin(wx/140)*amp + Math.sin(wx/57)*amp*0.35);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  // the 101: a ribbon on the horizon with slow-moving car dots
  ctx.fillStyle = '#9b9284'; ctx.fillRect(0, H-158, W, 5);
  ctx.fillStyle = '#f4f2ec';
  for (let i = 0; i < 9; i++) {
    const cx = ((i*173 + performance.now()/(i%2 ? 55 : -70)) % (W+40) + (W+40)) % (W+40) - 20;
    ctx.fillRect(cx, H-157, 5, 3);
  }
  // low glass office parks, nothing taller than four floors
  for (let i = 0; i < 9; i++) {
    const x = ((i*231 - cam.x*0.25) % (W+300)) - 150;
    const floors = 2 + (i*53)%3, bw = 90 + (i*37)%50, bh = floors*18;
    ctx.fillStyle = '#e7e3d6'; ctx.fillRect(x, H-120-bh, bw, bh+20);
    ctx.fillStyle = '#8fb7d9';
    for (let f = 0; f < floors; f++) for (let wx = 6; wx < bw-10; wx += 16)
      ctx.fillRect(x+wx, H-112-bh+f*18, 10, 9);
  }
  // palm trees on the nearer layer: trunk plus five fronds
  for (let i = 0; i < 7; i++) {
    const x = ((i*307 - cam.x*0.5) % (W+300)) - 150, ty = H-96;
    ctx.strokeStyle = '#8a6d43'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x, ty); ctx.quadraticCurveTo(x+6, ty-30, x+2, ty-52); ctx.stroke();
    ctx.strokeStyle = '#5e7d43'; ctx.lineWidth = 3;
    for (let f = 0; f < 5; f++) {
      const a = -Math.PI/2 - 0.9 + f*0.45;
      ctx.beginPath(); ctx.moveTo(x+2, ty-52);
      ctx.quadraticCurveTo(x+2+Math.cos(a)*22, ty-52+Math.sin(a)*22-6,
                           x+2+Math.cos(a)*34, ty-52+Math.sin(a)*34+8);
      ctx.stroke();
    }
  }
  // the monument sign
  const sx = ((520 - cam.x*0.5) % (W+300)) - 150;
  ctx.fillStyle = '#7a6a4f'; ctx.fillRect(sx, H-118, 8, 28);
  ctx.fillStyle = '#b3a284'; ctx.fillRect(sx-34, H-140, 76, 24);
  ctx.fillStyle = '#463a28'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SAND HILL RD', sx+4, H-124);
}

function drawTiles() {
  const pal = TILE_PAL[theme()];
  const tx0 = Math.floor(cam.x/TILE), tx1 = Math.ceil((cam.x+W)/TILE);
  for (let ty = 0; ty < MAP_H; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const ch = tileAt(tx,ty), x = tx*TILE, y = ty*TILE;
    if (ch === '#') {
      ctx.fillStyle = pal.gBody; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle = pal.gTop;  ctx.fillRect(x,y,TILE,5);
      ctx.fillStyle = pal.gSeam; ctx.fillRect(x+2,y+9,TILE-4,2);
    } else if (ch === '=') {
      ctx.fillStyle = pal.pBody; ctx.fillRect(x,y+4,TILE,14);
      ctx.fillStyle = pal.pTop;  ctx.fillRect(x,y+4,TILE,4);
    } else if (ch === 'J') {
      ctx.fillStyle = pal.jBase; ctx.fillRect(x+3, y+24, TILE-6, 12);     // base
      ctx.strokeStyle = pal.jCoil; ctx.lineWidth = 2;                    // coil
      ctx.beginPath();
      for (let i=0;i<4;i++){ ctx.moveTo(x+6, y+22-i*5); ctx.lineTo(x+TILE-6, y+19-i*5); }
      ctx.stroke();
      ctx.fillStyle = pal.jCoil; ctx.fillRect(x+3, y+2, TILE-6, 4);      // pad
    } else if (ch === 'G' && !gateOpen) {
      ctx.fillStyle = '#2a2136'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle = '#4a3a5e'; ctx.fillRect(x+3,y+3,TILE-6,TILE-6);
      ctx.fillStyle = '#2a2136'; ctx.fillRect(x+3,y+16,TILE-6,4);
    } else if (ch === 'C') {
      ctx.fillStyle = '#22314f'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle = '#3f5c8f';
      const off = (performance.now()/12) % TILE;
      for (let i=-1;i<3;i++) ctx.fillRect(x + ((i*14+off)%TILE+TILE)%TILE, y+2, 7, 4);
      ctx.fillStyle = '#584d78'; ctx.fillRect(x,y,TILE,2);
    }
  }
}

function drawEnts() {
  const t = performance.now()/1000;
  for (const e of ents) {
    if (e.t === 'coin' && !e.taken) {
      const bob = Math.sin(t*3 + e.x)*3;
      if (e.kind === 'term' || e.kind === 'safe' || e.kind === 'uncapped') {
        // a little document
        const w = e.r*1.6, h = e.r*2;
        ctx.save(); ctx.translate(e.x, e.y+bob);
        ctx.fillStyle = e.kind==='uncapped' ? '#ffd75e' : '#e8e6f0';
        ctx.fillRect(-w/2,-h/2,w,h);
        ctx.fillStyle = e.kind==='uncapped' ? '#8f6b00' : '#8a86a3';
        for (let i=0;i<3;i++) ctx.fillRect(-w/2+3, -h/2+4+i*5, w-6, 2);
        if (e.kind==='uncapped'){ ctx.fillStyle='#8f6b00'; ctx.font='bold 9px monospace';
          ctx.textAlign='center'; ctx.fillText('∞', 0, h/2-3); }
        ctx.restore();
      } else if (e.kind === 'seat') {
        ctx.save(); ctx.translate(e.x, e.y+bob);
        ctx.fillStyle = '#7ec8a9'; ctx.fillRect(-9,-4,18,5);   // seat
        ctx.fillRect(-9,-14,4,11); ctx.fillRect(-9,1,3,8); ctx.fillRect(6,1,3,8);
        ctx.restore();
      } else if (e.kind === 'prorata') {
        ctx.save(); ctx.translate(e.x, e.y+bob);
        ctx.fillStyle = '#9ecbff'; ctx.beginPath();
        ctx.moveTo(0,-11); ctx.lineTo(10,4); ctx.lineTo(-10,4); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#1a2340'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
        ctx.fillText('%', 0, 2);
        ctx.restore();
      } else if (e.kind === 'fees') {
        ctx.save(); ctx.translate(e.x, e.y+bob);
        ctx.fillStyle = '#ff8db1'; ctx.beginPath(); ctx.arc(0,-3,10,Math.PI,0); ctx.fill();
        ctx.fillStyle = '#f5edd8'; ctx.fillRect(-4,-3,8,8);
        ctx.fillStyle = '#1a2340'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
        ctx.fillText('2/20', 0, -5);
        ctx.restore();
      } else if (e.kind === 'accel') {
        // a GPU with a lightning bolt — the transformation power-up
        const g2 = 0.5 + 0.5*Math.sin(t*5 + e.x);
        ctx.save(); ctx.translate(e.x, e.y+bob);
        ctx.fillStyle = 'rgba(158,203,255,' + (0.12 + g2*0.18).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(0, 0, 20 + g2*5, 0, 7); ctx.fill();
        ctx.fillStyle = '#1d2b3f'; ctx.fillRect(-12,-9,24,18);
        ctx.fillStyle = '#9ecbff';
        for (let i=0;i<4;i++){ ctx.fillRect(-11+i*6,-13,3,4); ctx.fillRect(-11+i*6,9,3,4); }
        ctx.fillStyle = '#ffd75e'; ctx.beginPath();
        ctx.moveTo(2,-7); ctx.lineTo(-4,1); ctx.lineTo(0,1); ctx.lineTo(-2,7);
        ctx.lineTo(5,-2); ctx.lineTo(1,-2); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    } else if (NPC[e.t]) {
      NPC[e.t].draw(e);
    } else if (e.t === 'founder') {
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.fillStyle = '#c9b089'; ctx.fillRect(-5,-24,10,9);          // head
      ctx.fillStyle = '#39415e'; ctx.fillRect(-7,-15,14,15);         // patagonia vest
      ctx.fillStyle = '#8d94ad'; ctx.fillRect(-7,-15,3,15); ctx.fillRect(4,-15,3,15);
      // pitch bubble: rotates every 4 seconds, like the spec says
      const idx = (Math.floor(performance.now()/4000) + e.pitch) % FOUNDER_PITCHES.length;
      ctx.font = '10px monospace'; ctx.textAlign = 'center';
      const msg = '"' + FOUNDER_PITCHES[idx] + '"';
      const tw = ctx.measureText(msg).width + 10;
      ctx.fillStyle = 'rgba(232,230,240,0.92)';
      ctx.fillRect(-tw/2, -46, tw, 15);
      ctx.fillStyle = '#1a2340'; ctx.fillText(msg, 0, -35);
      ctx.restore();
    } else if (e.t === 'boss') {
      if (e.defeated > 1.6) continue;
      const hit = e.stun > 0 && Math.floor(performance.now()/70)%2 === 0;
      const open = e.mode === 'winded' && !e.defeated;
      ctx.save(); ctx.translate(e.x, e.y);
      if (e.defeated) { ctx.globalAlpha = Math.max(0, 1 - e.defeated/1.6); }
      if (open) {                                   // hunched — this is the opening
        ctx.scale(1, 0.86);
        ctx.strokeStyle = 'rgba(89,214,143,' + (0.5+0.5*Math.sin(performance.now()/120)).toFixed(2) + ')';
        ctx.lineWidth = 3; ctx.strokeRect(-36,-118,72,118);
      }
      if (e.mode === 'telegraph') {                 // the tell
        ctx.fillStyle = Math.floor(performance.now()/80)%2 ? '#ffd75e' : '#ff6b81';
        ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
        ctx.fillText('!', 0, -128);
      }
      if (e.mode === 'dash') {                      // motion streaks
        ctx.strokeStyle = 'rgba(255,215,94,0.5)'; ctx.lineWidth = 3;
        for (let i=1;i<=3;i++){ ctx.beginPath();
          ctx.moveTo(-e.face*(30+i*22), -80+i*18); ctx.lineTo(-e.face*(64+i*22), -80+i*18); ctx.stroke(); }
      }
      ctx.save(); ctx.scale(e.face, 1);
      if (bossKind() === 'debt') {
        // the shell: a stack of loan documents, edges ruled like a ledger
        ctx.fillStyle = '#d9dbe1';
        for (let i=0;i<5;i++) ctx.fillRect(-50, -82 + i*14, 26, 12);
        ctx.fillStyle = '#c0455a';
        for (let i=0;i<5;i++) ctx.fillRect(-46, -78 + i*14, 18, 2);
      } else {
        // the shell: a stack of everyone else's term sheets
        ctx.fillStyle = '#cfcbdd';
        for (let i=0;i<5;i++) ctx.fillRect(-50, -82 + i*14, 26, 12);
        ctx.fillStyle = '#8a86a3';
        for (let i=0;i<5;i++) ctx.fillRect(-46, -78 + i*14, 18, 2);
      }
      ctx.restore();
      if (bossKind() === 'debt') {
        const stampFlash = e.mode === 'telegraph' && Math.floor(performance.now()/80)%2;
        ctx.fillStyle = '#2a2d36'; ctx.fillRect(-26,-30,20,30); ctx.fillRect(6,-30,20,30);
        ctx.fillStyle = '#101216'; ctx.fillRect(-28,-7,22,7); ctx.fillRect(4,-7,22,7); // oxfords
        ctx.fillStyle = hit ? '#a7abb6' : '#585d68'; ctx.fillRect(-30,-78,60,50);  // grey suit
        ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-32,-86,64,9);                     // flat collar
        ctx.fillStyle = '#3a3e48'; ctx.fillRect(-3,-78,6,50);
        ctx.fillStyle = '#8a8f9c'; ctx.fillRect(-40,-76,10,34);
        ctx.fillStyle = '#4a3722'; ctx.fillRect(28,-64,16,26);                     // briefcase
        ctx.fillStyle = '#2c210f'; ctx.fillRect(33,-68,6,5);
        ctx.fillStyle = '#d9dbe1'; ctx.fillRect(-46,-58,14,20);                    // ledger under arm
        ctx.fillStyle = '#c0455a'; ctx.fillRect(-44,-54,10,2); ctx.fillRect(-44,-49,10,2);
        // the 1x PREF stamp, flashing on the telegraph
        ctx.save(); ctx.translate(0,-56); ctx.rotate(-0.18);
        ctx.strokeStyle = stampFlash ? '#ff6b81' : '#c0455a'; ctx.lineWidth = 3;
        ctx.strokeRect(-22,-9,44,18);
        ctx.fillStyle = stampFlash ? '#ff6b81' : '#c0455a';
        ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
        ctx.fillText('1x PREF', 0, 4);
        ctx.restore();
        ctx.fillStyle = '#cfb693'; ctx.fillRect(-13,-110,26,24);                   // head
        ctx.fillStyle = '#6a6f7a'; ctx.fillRect(-15,-114,30,7);                    // grey hair
        ctx.fillStyle = '#0d0f1a'; ctx.fillRect(-11,-103,22,5);                    // glasses
      } else {
        ctx.fillStyle = '#20263a'; ctx.fillRect(-26,-30,20,30); ctx.fillRect(6,-30,20,30);
        ctx.fillStyle = '#f0ede4'; ctx.fillRect(-28,-7,22,7); ctx.fillRect(4,-7,22,7);
        ctx.fillStyle = hit ? '#8ea3c9' : '#141d33'; ctx.fillRect(-30,-78,60,50);  // the vest, enormous
        ctx.fillStyle = '#6f87b8'; ctx.fillRect(-32,-86,64,9);                     // popped collar
        ctx.fillStyle = '#243357'; ctx.fillRect(-3,-78,6,50);
        ctx.fillStyle = '#6f87b8'; ctx.fillRect(-40,-76,10,34); ctx.fillRect(30,-76,10,34);
        ctx.fillStyle = '#d4af37'; ctx.beginPath(); ctx.arc(0,-58,11,0,7); ctx.fill();
        ctx.fillStyle = '#141d33'; ctx.beginPath();
        ctx.moveTo(0,-65); ctx.lineTo(6,-58); ctx.lineTo(0,-51); ctx.lineTo(-6,-58);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#dbb894'; ctx.fillRect(-13,-110,26,24);
        ctx.fillStyle = '#b8b4cc'; ctx.fillRect(-15,-114,30,7);                    // silver hair
        ctx.fillStyle = '#0d0f1a'; ctx.fillRect(-11,-103,22,5);                    // glasses
      }
      ctx.restore();
      ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      if (e.defeated) { ctx.fillStyle = '#b8b4cc';
        ctx.fillText(BOSS().beaten, e.x, e.y - 126); }
      else if (e.mode === 'winded') { ctx.fillStyle = '#59d68f'; ctx.fillText(BOSS().winded, e.x, e.y - 126); }
      else { ctx.fillStyle = BOSS().gold; ctx.fillText(BOSS().name + ' · ' + BOSS().pips + ' ' + '●'.repeat(Math.max(0,e.hp)), e.x, e.y - 126); }
    } else if (e.t === 'proj' && !e.gone) {
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(performance.now()/90);
      ctx.fillStyle = '#ffd75e'; ctx.fillRect(-8,-11,16,22);
      ctx.fillStyle = '#8f6b00';
      for (let i=0;i<3;i++) ctx.fillRect(-5,-7+i*5,10,2);
      ctx.restore();
    } else if (e.t === 'wave' && !e.gone) {
      ctx.fillStyle = 'rgba(212,175,55,0.8)';
      ctx.beginPath(); ctx.moveTo(e.x-16, e.y); ctx.lineTo(e.x, e.y-22);
      ctx.lineTo(e.x+16, e.y); ctx.closePath(); ctx.fill();
    } else if (e.t === 'float' && !e.gone) {
      ctx.globalAlpha = Math.min(1, e.life*2);
      ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = e.col || '#ffd75e'; ctx.fillText(e.txt, e.x, e.y);
      ctx.globalAlpha = 1;
    } else if (e.t === 'flag') {
      ctx.save(); ctx.translate(e.x, 0);
      ctx.fillStyle = '#b8b4cc'; ctx.fillRect(-2, TILE*4.2, 4, TILE*5.8);
      ctx.fillStyle = '#59d68f'; ctx.beginPath();
      ctx.moveTo(2, TILE*4.2); ctx.lineTo(46, TILE*4.7); ctx.lineTo(2, TILE*5.2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0d2b1c'; ctx.font = 'bold 10px monospace'; ctx.textAlign='left';
      ctx.fillText('IPO', 8, TILE*4.85);
      ctx.restore();
    }
  }
}

function drawPlayer() {
  const s = P.scale;
  // AI ACCELERATION: three fading afterimages trailing the sprite
  if (G.company && G.company.accel > 0) {
    for (let i = 3; i >= 1; i--) {
      ctx.save();
      ctx.globalAlpha = 0.10 * i;
      ctx.translate(P.x - P.dir * (P.vx !== 0 ? i * 11 : 0), P.y);
      ctx.scale(P.dir * s, s);
      ctx.fillStyle = '#9ecbff';
      ctx.fillRect(-9, -36, 18, 36);
      ctx.restore();
    }
  }
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.scale(P.dir * s, s);
  // the VC: navy fleece vest over blue oxford, khakis
  ctx.fillStyle = '#e3c29e'; ctx.fillRect(-7,-34,14,10);      // head
  ctx.fillStyle = '#2b2b33'; ctx.fillRect(-7,-36,14,4);       // hair
  ctx.fillStyle = '#6f87b8'; ctx.fillRect(-9,-24,18,7);       // oxford
  ctx.fillStyle = '#1f2d4d'; ctx.fillRect(-9,-19,18,11);      // THE VEST
  ctx.fillStyle = '#31436b'; ctx.fillRect(-2,-19,4,11);       // zipper
  ctx.fillStyle = '#b0996b'; ctx.fillRect(-8,-8,7,8); ctx.fillRect(1,-8,7,8); // khakis
  ctx.fillStyle = '#f0ede4'; ctx.fillRect(-9,-1,8,3); ctx.fillRect(1,-1,8,3); // allbirds
  // face
  ctx.fillStyle = '#1a1a22'; ctx.fillRect(2,-31,2,2);
  if (G.company && G.company.fees > 0) { // fee halo
    ctx.strokeStyle = 'rgba(255,141,177,0.7)'; ctx.lineWidth = 2;
    ctx.strokeRect(-12,-38,24,42);
  }
  ctx.restore();
}

// ---------------------------------------------------------------- HUD
function drawHUD() {
  const C = G.company;
  ctx.textAlign = 'left';

  // TVPI — huge, glorious, fake
  const tv = tvpiVal();
  ctx.font = 'bold 34px monospace';
  ctx.fillStyle = tv >= 1 ? '#59d68f' : '#e8e6f0';
  ctx.fillText('TVPI ' + tv.toFixed(2) + 'x', 20, 44);
  // DPI — small, honest
  const dp = dpiVal();
  ctx.font = '13px monospace';
  ctx.fillStyle = dp > 0 ? '#9ecbff' : '#6a677f';
  ctx.fillText('DPI ' + dp.toFixed(2) + 'x' + (dp === 0 ? '  (this is the real one)' : ''), 22, 64);

  // AI ACCELERATION pill with a draining bar
  if (C && C.accel > 0) {
    ctx.fillStyle = 'rgba(29,43,63,0.9)'; ctx.fillRect(W/2-110, 30, 220, 30);
    ctx.strokeStyle = '#9ecbff'; ctx.lineWidth = 2; ctx.strokeRect(W/2-110, 30, 220, 30);
    ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#9ecbff'; ctx.textAlign = 'center';
    ctx.fillText('AI ACCELERATION', W/2, 45);
    ctx.fillStyle = '#2b2840'; ctx.fillRect(W/2-100, 50, 200, 5);
    ctx.fillStyle = '#9ecbff'; ctx.fillRect(W/2-100, 50, 200 * Math.min(1, C.accel/9), 5);
    ctx.textAlign = 'left';
  }
  // the pickup moment: huge, centre-screen, scaling in
  if (G.banner && G.bannerT > 0) {
    const k = Math.min(1, (1.4 - G.bannerT) / 0.18);
    ctx.save();
    ctx.translate(W/2, H*0.36);
    ctx.scale(0.4 + 0.6*k, 0.4 + 0.6*k);
    ctx.globalAlpha = Math.min(1, G.bannerT / 0.35);
    ctx.font = 'bold 40px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd75e'; ctx.fillText(G.banner, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // portfolio dots
  ctx.font = '12px monospace'; ctx.fillStyle = '#b8b4cc';
  ctx.fillText('PORTFOLIO', 20, 90);
  for (let i = 0; i < G.maxLives; i++) {
    const alive = i < G.companies;
    ctx.fillStyle = alive ? '#59d68f' : '#43405c';
    ctx.beginPath(); ctx.arc(100 + i*16, 86, 5, 0, 7); ctx.fill();
    if (!alive) { ctx.strokeStyle='#2b2840'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(96+i*16,82); ctx.lineTo(104+i*16,90);
      ctx.moveTo(104+i*16,82); ctx.lineTo(96+i*16,90); ctx.stroke(); }
  }

  // reserves + current company
  ctx.fillStyle = '#b8b4cc'; ctx.font = '12px monospace';
  ctx.fillText('RESERVES ' + fmtM(G.reserves), 20, 112);
  if (C) {
    ctx.fillText('CO. #' + G.companyIdx + '  ' + (C.hot ? C.hot + '  ' : '') +
      ROUND_NAMES[C.round] +
      '  mark ' + fmtM(C.paper) + (C.proRata>0?'  [PRO RATA]':''), 20, 130);
    // how much of that mark is air, and what it converts to
    const air = C.hype / Math.max(1, C.paper);
    const cost = RAISE_COST[Math.min(C.round, RAISE_COST.length-1)];
    if (C.hype > 0) {
      ctx.fillStyle = air > 0.5 ? '#ff6b81' : '#ffd75e'; ctx.font = '11px monospace';
      ctx.fillText('  ' + (air*100).toFixed(0) + '% of that is paper → exits at ' +
                   fmtM((C.paper - C.hype) + C.hype*HYPE_CONVERT), 20, 146);
    }
    ctx.font = '11px monospace';
    ctx.fillStyle = G.reserves >= cost ? '#9ecbff' : '#3d3a52';
    ctx.fillText('[R] raise a round — ' + fmtM(cost) + ' of reserves', 20, C.hype > 0 ? 162 : 148);
  } else {
    ctx.fillStyle = '#ffd75e'; ctx.fillText('IN A PROCESS', 20, 130);
  }

  // world + runway — top right. the runway is this company's life expectancy.
  const wsecs = WORLDS[G.world].secs, rfrac = Math.max(0, G.clock / wsecs);
  ctx.textAlign = 'right';
  ctx.font = 'bold 18px monospace';
  ctx.fillStyle = '#b8b4cc';
  ctx.fillText((G.daily ? 'DAILY #' + DAILY_NUM + ' · ' : '') +
    'WORLD ' + WORLDS[G.world].level + ' · ' + LEVELS[G.levelId].name.toUpperCase(), W-20, 38);
  if (G.mode === 'level') {
    ctx.font = '11px monospace';
    ctx.fillStyle = rfrac < 0.25 ? '#ff6b81' : '#6a677f';
    ctx.fillText('RUNWAY ' + Math.ceil(G.clock) + 's', W-226, 55);
    ctx.fillStyle = '#2b2840'; ctx.fillRect(W-220, 48, 200, 8);
    ctx.fillStyle = rfrac < 0.25 ? '#ff6b81' : '#59d68f';
    ctx.fillRect(W-220, 48, 200 * Math.min(1, rfrac), 8);
  }
  ctx.font = '11px monospace'; ctx.fillStyle = '#6a677f';
  if (G.mode === 'boss') {
    ctx.fillStyle = G.reserves >= RESERVE_PUSH_COST ? '#9ecbff' : '#3d3a52';
    ctx.fillText('[X] burn $' + RESERVE_PUSH_COST + 'M dry powder → hold them ' +
                 RESERVE_PUSH_SECS + 's', W-20, 72);
    ctx.fillStyle = '#ff6b81';
    ctx.fillText('no door. no pass. through him.', W-20, 90);
  } else {
    ctx.fillText('best exit: ' + (G.exits.length ? fmtM(bestExit()) : '—'), W-20, 72);
    ctx.fillText('[X] secondary — sells the MARK at ' + (SECONDARY_RATE*100) + '%', W-20, 90);
  }

  // published bands: what you are on pace for, and what the next one costs
  {
    const cur = bandFor(bestExit()/CHECK, dpiVal()), nb = nextBand();
    ctx.textAlign = 'right'; ctx.font = 'bold 12px monospace';
    ctx.fillStyle = '#b8b4cc';
    ctx.fillText('ON PACE: ' + cur.name, W-20, 118);
    if (nb) {
      const needBest = nb.best*CHECK, needDpi = nb.dpi;
      ctx.font = '11px monospace'; ctx.fillStyle = '#6a677f';
      ctx.fillText(nb.name + ' needs one exit ≥ ' + fmtM(needBest) +
                   ' and DPI ' + needDpi.toFixed(1) + 'x', W-20, 134);
      ctx.fillText('you: ' + fmtM(bestExit()) + ' · DPI ' + dpiVal().toFixed(2) + 'x', W-20, 148);
    }
  }

  // the boss meter: it fills instead of emptying, because it is the price
  if (G.mode === 'boss') {
    const D = G.deal;
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#b8b4cc';
    ctx.fillText(bossKind()==='debt' ? 'THE RECAP' : 'THE HOT DEAL', W/2, 106);
    const frac = Math.min(1, (D.val - HOT_ENTRY) / (420 - HOT_ENTRY));
    ctx.fillStyle = '#2b2840'; ctx.fillRect(W/2-170, 114, 340, 13);
    ctx.fillStyle = D.val > 240 ? '#ff6b81' : BOSS().gold;
    ctx.fillRect(W/2-170, 114, 340*frac, 13);
    ctx.strokeStyle = '#584d78'; ctx.lineWidth = 1; ctx.strokeRect(W/2-170, 114, 340, 13);
    ctx.font = 'bold 17px monospace'; ctx.fillStyle = '#ffd75e';
    ctx.fillText((bossKind()==='debt' ? 'DEBT AHEAD OF YOU ' : 'POST-MONEY ') + fmtM(D.val), W/2, 146);
    ctx.font = '11px monospace'; ctx.fillStyle = '#6a677f';
    ctx.fillText(bossKind()==='debt'
      ? 'it all pays out before your ' + (CHECK/D.val*100).toFixed(1) + '%'
      : 'your $10M buys ' + (CHECK/D.val*100).toFixed(1) + '%', W/2, 162);

    // the rival closing the round: the thing your money actually buys off
    const rf = Math.max(0, Math.min(1, D.t / D.t0));
    const urgent = D.t < 7;
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = D.dis ? '#ff6b81' : urgent ? '#ff6b81' : '#b8b4cc';
    ctx.fillText(BOSS().clockLabel(D) + ' — ' + Math.ceil(D.t) + 's' +
                 (D.dis ? '   ⚠ YOU LOOK DISINTERESTED (2.6x)' : ''), W/2, 186);
    ctx.fillStyle = '#2b2840'; ctx.fillRect(W/2-170, 192, 340, 9);
    ctx.fillStyle = (urgent || D.dis) ? '#ff6b81' : '#9ecbff';
    ctx.fillRect(W/2-170, 192, 340*rf, 9);
    ctx.strokeStyle = '#584d78'; ctx.lineWidth = 1; ctx.strokeRect(W/2-170, 192, 340, 9);
    // his conviction: three hits and he walks
    const bs = ents.find(e => e.t === 'boss');
    const hp = bs ? Math.max(0, bs.hp) : 0;
    ctx.font = '11px monospace'; ctx.fillStyle = '#6a677f';
    ctx.fillText(bossKind()==='debt' ? 'THEIR COVENANTS' : 'HIS CONVICTION', W/2 - 46, 180);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < hp ? '#ff6b81' : '#39304a';
      ctx.beginPath(); ctx.arc(W/2 + 22 + i*16, 176, 5, 0, 7); ctx.fill();
    }
  }

  // toast
  if (G.toast) {
    ctx.textAlign = 'center'; ctx.font = 'bold 15px monospace';
    const tw = ctx.measureText(G.toast).width + 30;
    ctx.fillStyle = 'rgba(13,15,26,0.85)';
    ctx.fillRect(W/2 - tw/2, H-78, tw, 34);
    ctx.fillStyle = '#ffd75e';
    ctx.fillText(G.toast, W/2, H-56);
  }
}

function drawDeathCard() {
  const O = G.deathOverride;
  ctx.fillStyle = 'rgba(13,15,26,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = O ? '#ff6b81' : '#e8e6f0'; ctx.font = 'bold 26px monospace';
  ctx.fillText(O ? O.headline : 'COMPANY #' + G.companyIdx + ' — MARKED TO ZERO',
               W/2, H/2 - 40);
